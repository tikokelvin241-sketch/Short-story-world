
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short Story World</title>
<style>
:root{--bg:#0c1220;--panel:#172238;--panel2:#202e47;--gold:#f2b84b;--text:#f7f8fb;--muted:#b9c4d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:24px 16px;text-align:center;background:linear-gradient(135deg,#172b49,#101522)}
header h1{margin:0 0 8px;font-size:clamp(27px,6vw,42px)}
header p{margin:0;color:var(--muted)}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px;background:#111a2b;position:sticky;top:0;z-index:5}
button{border:0;border-radius:9px;padding:11px 15px;background:var(--gold);color:#1a1a1a;font-weight:700;cursor:pointer}
button.secondary{background:var(--panel2);color:white;border:1px solid #40516c}
main{max-width:900px;margin:auto;padding:18px}
.card{background:var(--panel);border:1px solid #293953;border-radius:14px;padding:18px;margin:12px 0}
.card h2,.card h3{margin-top:0}
.muted{color:var(--muted);line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.episode{width:100%;text-align:left;margin:5px 0;background:var(--panel2);color:white;border:1px solid #40516c}
video{width:100%;max-height:480px;background:#05070b;border-radius:10px}
footer{text-align:center;color:var(--muted);padding:25px}
</style>
</head>
<body>
<header>
<header>
<h1>SHORT STORY WORLD</h1>
<p>Stories • AI Drama • Videos</p>

<label for="siteLanguage">Choose language / Chagua lugha</label>
<br><br>

<select id="siteLanguage" onchange="setSiteLanguage(this.value)">
<option value="en">English</option>
<option value="sw">Kiswahili</option>
<option value="fr">Français</option>
<option value="es">Español</option>
<option value="ar">العربية</option>
</select>

<p id="languageNotice">Choose your language</p>
</header>


<nav>
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('stories')">Stories</button>
<button onclick="showPage('drama')">AI Drama</button>
<button onclick="showPage('videos')">Videos</button>
</nav>

<main id="app"></main>
<footer>Short Story World · Original stories and AI drama</footer>

<script>
const episodes = [
["The Secret","Amina receives a mysterious message warning her not to marry Daniel.","Amina: Daniel, is there something you're hiding from me? Daniel: The truth might make you hate me forever. A sudden knock interrupts them."],
["The Stranger","A stranger arrives at Daniel's home and knows Amina's name.","Amina opens the door. A stranger says, You deserve to know what happened five years ago. Daniel rushes to the door."],
["The Photograph","An old photograph reveals a connection Daniel never mentioned.","Amina finds a photograph hidden inside a book. On the back is a date—and Daniel's handwriting."],
["A Dangerous Promise","Daniel promises to explain everything, but asks Amina for one more day.","Give me until tomorrow, Daniel says. Amina wonders whether one more day will change anything."],
["The Phone Call","A late-night phone call changes Amina's understanding of the past.","At midnight, Amina answers an unknown number. A trembling voice says, He is not telling you everything."],
["The Betrayal","Amina discovers that someone close to her has been lying.","Amina confronts her closest friend. The silence between them says more than words."],
["The Missing Letter","A letter disappears before Amina can finish reading it.","She searches the room and finds an empty envelope under the door."],
["The Secret Meeting","Amina sees Daniel meeting the stranger in secret.","From across the street, Amina watches Daniel hand over a small package."],
["The Confession","Amina demands the complete truth.","Daniel finally sits down. There is something I should have told you from the beginning."],
["The Past Returns","Someone from Daniel's past comes back.","A familiar face appears at the gate. Daniel whispers, I never thought I would see you again."],
["The Evidence","Amina finds evidence that changes her understanding.","A recorded message reveals a detail that nobody expected."],
["The Warning","Amina receives one final warning.","The message reads: Do not go to the old house alone."],
["The Choice","Amina must decide whether to trust Daniel.","She has two choices: walk away, or hear the whole story."],
["The Disappearance","Daniel suddenly disappears.","His phone is switched off and his apartment is empty. Amina finds one clue on the table."],
["The Search","Amina follows the clue to find answers.","The trail leads to a quiet town where a neighbour recognises Daniel's photograph."],
["The Truth","A hidden secret is finally revealed.","The stranger tells Amina what happened years ago. At last, the pieces begin to fit."],
["The Enemy","Amina discovers who has been working against them.","The person behind the messages is closer than Amina imagined."],
["The Final Test","Daniel must prove that he can be trusted.","Daniel has one chance to show that his actions match his promises."],
["The Last Chance","Amina makes her most difficult decision.","Amina asks for honesty, not another promise. Daniel must answer."],
["A New Beginning","The truth changes their future forever.","After everything, Amina decides what kind of future she wants. Their story reaches a new beginning."]
];



const stories = [
  {
    id: 1,
    title: "The Secret Behind the Millionaire",
    category: "Love & Mystery",
    image: "https://images.unsplash.com/photo-1519608487953-e999c86e7455",
    description: "A love story filled with secrets, betrayal and unexpected discoveries.",
    content: `
CHAPTER ONE: THE STRANGER

The rain was falling heavily in the city of London.
Amina stood beside the window of her small apartment,
watching the people rushing through the streets.

She had always believed that true love was something
beautiful. But after what happened three years ago,
she had stopped trusting people.

Her phone suddenly rang.

"Hello?" she answered.

"Amina, I need to see you. There is something
important I must tell you," a man's voice said.

"Who is this?"

"It's Daniel."

Amina froze. She had not heard that name in three years.

"Daniel? How did you get my number?"

"I know you have many questions. Please, meet me
tomorrow at the old restaurant."

She wanted to hang up, but curiosity stopped her.

"Why now, Daniel? Why after all these years?"

There was silence.

"Because the truth about your father is finally
coming out."

The call ended.

Amina slowly lowered her phone. Her father had died
when she was only sixteen. What truth could Daniel
possibly know?

CHAPTER TWO: THE MEETING

The following morning, Amina arrived at the restaurant
twenty minutes early.

Daniel was already sitting at a table near the window.

He looked different. He wore an expensive black suit
and a silver watch. But his eyes were the same.

"Hello, Amina," he said.

"Don't pretend we are old friends. Tell me why
you called me."

Daniel opened a brown envelope and placed several
documents on the table.

"Your father did not die poor, Amina. He owned
a company worth millions."

Amina looked at him in disbelief.

"That's impossible. My mother struggled to pay
our school fees."

"I know. Someone stole everything."

"Who?"

Daniel looked around before answering.

"My father."

Amina stood up immediately.

"Are you telling me your family destroyed mine?"

Daniel lowered his head.

"I am telling you that I have evidence, and I want
to help you recover what belongs to you."

Amina picked up the envelope.

Inside were photographs, bank statements and
a document bearing her father's signature.

But one photograph made her heart stop.

It showed her mother standing beside Daniel's father
on the day her own father disappeared.

"What is my mother hiding?" she whispered.

Daniel had no answer.

CHAPTER THREE: THE BIGGEST SECRET

That evening, Amina returned home and placed the
photograph in front of her mother.

"Tell me the truth. What happened between you
and Mr. William?"

Her mother's hands began to shake.

"Where did you get this?"

"Daniel gave it to me."

Her mother sat down slowly.

"There are things you are too young to understand."

"I am not a child anymore. I deserve the truth!"

Her mother began to cry.

"Your father was planning to leave the country.
He had discovered something terrible about William."

"What was it?"

Before her mother could answer, someone knocked
three times on the front door.

Amina opened it.

A man stood outside holding a black suitcase.

"Are you Amina?" he asked.

"Yes. Who are you?"

The man handed her a letter.

"Your father asked me to give you this when
the right time came."

Amina opened the letter.

The first sentence read:

'My daughter, if you are reading this,
then the people who betrayed me have finally
found their way back to you.'

She looked up.

The stranger was already walking away.

And suddenly, her phone rang again.

Unknown number.

She answered.

"Stop investigating your father's death,
or you will lose everything."

The call ended.

Amina looked at Daniel's photograph on the table.

This was no longer just about money.

It was about her family, her past,
and a dangerous secret that someone was willing
to kill to protect.

TO BE CONTINUED...
`
  }
];

function openLongStory(id) {
  const story = stories.find(item => item.id === id);
  if (!story) return;

  const app = document.getElementById("app");

  app.innerHTML = `
    <div style="max-width:850px;margin:auto;padding:20px;">
      <button onclick="showPage('stories')">← Back to Stories</button>

      <h1>${story.title}</h1>

      <p style="color:gray">${story.category}</p>

      <img src="${story.image}"
        style="width:100%;border-radius:14px;max-height:350px;object-fit:cover;">

      <p style="font-size:18px;line-height:1.9;white-space:pre-line;">
        ${story.content}
      </p>

      <h2>More chapters coming soon...</h2>

      <button onclick="showPage('stories')">
        Discover More Stories
      </button>
    </div>
  `;
}


 
const newDramas = [
{
  title: "The Hidden Secret",
  description: "A family mystery that reveals a dangerous truth.",
  episodes: [
    ["The Inheritance", "A young woman inherits a mysterious family house.", "Sarah: Why did my father leave this house to me? Her uncle replies: Some secrets should remain buried."],
    ["The Locked Room", "Sarah discovers a locked room inside the house.", "Sarah finds an old key beneath the floor. When the door opens, she discovers photographs of people she has never met."],
    ["The Family Secret", "An old diary reveals a shocking family secret.", "The diary reads: Your real family story began with a lie. Sarah begins to question everything."],
    ["The Stranger", "A mysterious visitor arrives with a warning.", "Stranger: You must leave this house tonight. Sarah: Who are you? Stranger: Someone who knows what happened."],
    ["The Truth", "Sarah finally discovers the truth about her father.", "Sarah reads the final letter. Her father's secret changes everything she believed about her family."]
  ]
},
{
  title: "The Last Promise",
  description: "A love story tested by distance, betrayal and difficult choices.",
  episodes: [
    ["The First Meeting", "Two strangers meet and their lives change forever.", "David: I feel like I have known you forever. Maria smiles: Perhaps our story started before today."],
    ["The Promise", "David makes Maria a promise he may struggle to keep.", "Maria: Promise me you will never lie to me. David: I promise. But the future has other plans."],
    ["The Distance", "A new opportunity separates the couple.", "David receives an offer to work abroad. Maria asks: Are you choosing your dream over us?"],
    ["The Betrayal", "A secret message threatens their relationship.", "Maria discovers a message on David's phone. She asks: Tell me the truth. David cannot answer."],
    ["The Last Promise", "The couple must decide whether their love deserves another chance.", "Maria: I cannot live on promises anymore. David: Then let me show you the truth through my actions."]
  ]
}
];
 
function setSiteLanguage(language) {
  currentLanguage = language;

  const translations = {
    en: ["Home", "Stories", "AI Drama", "Videos", "Choose your language"],
    sw: ["Nyumbani", "Hadithi", "Drama za AI", "Video", "Chagua lugha yako"],
    fr: ["Accueil", "Histoires", "Drame IA", "Vidéos", "Choisissez votre langue"],
    es: ["Inicio", "Historias", "Drama IA", "Vídeos", "Elige tu idioma"],
    ar: ["الرئيسية", "القصص", "دراما الذكاء الاصطناعي", "الفيديوهات", "اختر لغتك"]
  };

  const t = translations[language] || translations.en;

  const buttons = document.querySelectorAll("nav button");

  buttons.forEach((button, i) => {
    if (t[i] !== undefined) {
      button.textContent = t[i];
    }
  });

  const notice = document.getElementById("languageNotice");
  if (notice) {
    notice.textContent = t[4];
  }

  if (typeof currentPage !== "undefined" &&
      typeof showPage === "function") {
    showPage(currentPage);
  }
}


function showPage(page) {
  currentPage = page;
  const app = document.getElementById("app");

  const words = {
    en: ["Welcome to Short Story World","Discover original short stories, follow drama series, and watch videos.","Explore Stories","Open AI Drama","Open Videos","Featured drama","Season 1 · 20 episodes","Start Episode 1","Choose a story to read.","Read story","Select an episode to open its story.","Video player is ready. Add your MP4 video files to the project.","No video has been uploaded yet.","Episode","Stories","Videos"],
    sw: ["Karibu Short Story World","Gundua hadithi mpya, fuatilia tamthilia na tazama video.","Chunguza Hadithi","Fungua Drama za AI","Fungua Video","Drama maalumu","Msimu wa 1 · Vipindi 20","Anza Kipindi cha 1","Chagua hadithi ya kusoma.","Soma hadithi","Chagua kipindi ili kufungua hadithi yake.","Kicheza video kiko tayari. Ongeza faili zako za MP4.","Bado hakuna video iliyowekwa.","Kipindi","Hadithi","Video"],
    fr: ["Bienvenue sur Short Story World","Découvrez des histoires originales, des séries dramatiques et des vidéos.","Explorer les histoires","Ouvrir le drame IA","Ouvrir les vidéos","Drame à la une","Saison 1 · 20 épisodes","Commencer l'épisode 1","Choisissez une histoire à lire.","Lire l'histoire","Choisissez un épisode pour lire son histoire.","Le lecteur vidéo est prêt. Ajoutez vos fichiers MP4.","Aucune vidéo n'a encore été ajoutée.","Épisode","Histoires","Vidéos"],
    es: ["Bienvenido a Short Story World","Descubre historias originales, series dramáticas y vídeos.","Explorar historias","Abrir drama IA","Abrir vídeos","Drama destacado","Temporada 1 · 20 episodios","Comenzar episodio 1","Elige una historia para leer.","Leer historia","Elige un episodio para abrir su historia.","El reproductor está listo. Añade tus archivos MP4.","Todavía no se ha subido ningún vídeo.","Episodio","Historias","Vídeos"],
    ar: ["مرحباً بك في عالم القصص القصيرة","اكتشف قصصاً أصلية وتابع المسلسلات وشاهد الفيديوهات.","استكشف القصص","افتح دراما الذكاء الاصطناعي","افتح الفيديوهات","دراما مميزة","الموسم الأول · 20 حلقة","ابدأ الحلقة الأولى","اختر قصة لقراءتها.","اقرأ القصة","اختر حلقة لفتح قصتها.","مشغل الفيديو جاهز. أضف ملفات MP4.","لم يتم تحميل أي فيديو بعد.","الحلقة","القصص","الفيديوهات"]
  };

  const language = typeof currentLanguage !== "undefined" ? currentLanguage : "en";
const t = words[language] || words.en;

  if (page === "home") {
    app.innerHTML = `
    <section class="card">
      <h2>${t[0]}</h2>
      <p class="muted">${t[1]}</p>
      <div class="grid">
        <button onclick="showPage('stories')">${t[2]}</button>
        <button onclick="showPage('drama')">${t[3]}</button>
        <button onclick="showPage('videos')">${t[4]}</button>
      </div>
    </section>
    <section class="card">
      <h3>${t[5]}</h3>
      <p><b>Love and Betrayal</b> · ${t[6]}</p>
      <button onclick="openEpisode(1)">${t[7]}</button>
    </section>`;
  }

  else if (page === "stories") {
    app.innerHTML = `<h2>${t[14]}</h2>
    <p class="muted">${t[8]}</p><div class="grid">` +
    stories.map((s,i) => `
      <article class="card">
        <h3>${s[0]}</h3>
        <p class="muted">${s[1]}</p>
        <button onclick="openStory(${i})">${t[9]}</button>
      </article>`).join("") + `</div>`;
  }

 
else if (page === "drama") {
  app.innerHTML = `
    <h2>AI Drama</h2>
    <p class="muted">Choose your favourite drama series.</p>

    <div class="grid">
      <section class="card">
        <h3>Love and Betrayal</h3>
        <p class="muted">Season 1 · 20 Episodes</p>
        <button onclick="showOriginalEpisodes()">
          Watch Episodes
        </button>
      </section>

      ${newDramas.map((d,i) => `
        <section class="card">
          <h3>${d.title}</h3>
          <p class="muted">${d.description}</p>
          <p>Season 1 · ${d.episodes.length} Episodes</p>
          <button onclick="showNewDramaEpisodes(${i})">
            Watch Episodes
          </button>
        </section>
      `).join("")}
    </div>
  `;
}


  else if (page === "videos") {
    app.innerHTML = `<section class="card">
      <h2>${t[15]}</h2>
      <p class="muted">${t[11]}</p>
      <video controls playsinline preload="metadata">
        <source src="" type="video/mp4">
      </video>
      <p class="muted">${t[12]}</p>
    </section>`;
  }
}


function openEpisode(n){
const e=episodes[n-1];
if(!e)return;

document.getElementById('app').innerHTML=`
<section class="card">
<p class="muted">LOVE AND BETRAYAL · SEASON 1</p>
<h2>Episode ${n}: ${e[0]}</h2>
<p>${e[1]}</p>
<h3>Episode story</h3>
<p class="muted">${e[2]}</p>
<button onclick="showPage('drama')">Back to episodes</button>
<button class="secondary" onclick="openEpisode(${Math.min(n+1,20)})" ${n===20?'disabled':''}>Next episode</button>
</section>`;

window.scrollTo(0,0);
}

function openStory(i){
const s=stories[i];

document.getElementById('app').innerHTML=`
<section class="card">
<h2>${s[0]}</h2>
<p class="muted">${s[2]}</p>
<button onclick="showPage('stories')">Back to stories</button>
</section>`;

window.scrollTo(0,0);
}

showPage('home');
</script>
</body>
</html>
