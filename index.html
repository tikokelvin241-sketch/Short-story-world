
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short Story World</title>
<style>
:root{--bg:#0c1220;--panel:#172238;--panel2:#202e47;--gold:#f2b84b;--text:#f7f8fb;--muted:#b9c4d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:24px 16px;text-align:center;background:linear-gradient(135deg,#172b49,#101522)}
header h1{margin:0 0 8px;font-size:clamp(27px,6vw,42px)}
header p{margin:0;color:var(--muted)}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px;background:#111a2b;position:sticky;top:0;z-index:5}
button{border:0;border-radius:9px;padding:11px 15px;background:var(--gold);color:#1a1a1a;font-weight:700;cursor:pointer}
button.secondary{background:var(--panel2);color:white;border:1px solid #40516c}
main{max-width:900px;margin:auto;padding:18px}
.card{background:var(--panel);border:1px solid #293953;border-radius:14px;padding:18px;margin:12px 0}
.card h2,.card h3{margin-top:0}
.muted{color:var(--muted);line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.episode{width:100%;text-align:left;margin:5px 0;background:var(--panel2);color:white;border:1px solid #40516c}
video{width:100%;max-height:480px;background:#05070b;border-radius:10px}
footer{text-align:center;color:var(--muted);padding:25px}
</style>
</head>
<body>
<header>
<header>
<h1>SHORT STORY WORLD</h1>
<p>Stories • AI Drama • Videos</p>

<label for="siteLanguage">Choose language / Chagua lugha</label>
<br><br>

<select id="siteLanguage" onchange="setSiteLanguage(this.value)">
<option value="en">English</option>
<option value="sw">Kiswahili</option>
<option value="fr">Français</option>
<option value="es">Español</option>
<option value="ar">العربية</option>
</select>

<p id="languageNotice">Choose your language</p>
</header>


<nav>
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('stories')">Stories</button>
<button onclick="showPage('drama')">AI Drama</button>
<button onclick="showPage('videos')">Videos</button>
</nav>

<main id="app"></main>
<footer>Short Story World · Original stories and AI drama</footer>

<script>
const episodes = [
["The Secret","Amina receives a mysterious message warning her not to marry Daniel.","Amina: Daniel, is there something you're hiding from me? Daniel: The truth might make you hate me forever. A sudden knock interrupts them."],
["The Stranger","A stranger arrives at Daniel's home and knows Amina's name.","Amina opens the door. A stranger says, You deserve to know what happened five years ago. Daniel rushes to the door."],
["The Photograph","An old photograph reveals a connection Daniel never mentioned.","Amina finds a photograph hidden inside a book. On the back is a date—and Daniel's handwriting."],
["A Dangerous Promise","Daniel promises to explain everything, but asks Amina for one more day.","Give me until tomorrow, Daniel says. Amina wonders whether one more day will change anything."],
["The Phone Call","A late-night phone call changes Amina's understanding of the past.","At midnight, Amina answers an unknown number. A trembling voice says, He is not telling you everything."],
["The Betrayal","Amina discovers that someone close to her has been lying.","Amina confronts her closest friend. The silence between them says more than words."],
["The Missing Letter","A letter disappears before Amina can finish reading it.","She searches the room and finds an empty envelope under the door."],
["The Secret Meeting","Amina sees Daniel meeting the stranger in secret.","From across the street, Amina watches Daniel hand over a small package."],
["The Confession","Amina demands the complete truth.","Daniel finally sits down. There is something I should have told you from the beginning."],
["The Past Returns","Someone from Daniel's past comes back.","A familiar face appears at the gate. Daniel whispers, I never thought I would see you again."],
["The Evidence","Amina finds evidence that changes her understanding.","A recorded message reveals a detail that nobody expected."],
["The Warning","Amina receives one final warning.","The message reads: Do not go to the old house alone."],
["The Choice","Amina must decide whether to trust Daniel.","She has two choices: walk away, or hear the whole story."],
["The Disappearance","Daniel suddenly disappears.","His phone is switched off and his apartment is empty. Amina finds one clue on the table."],
["The Search","Amina follows the clue to find answers.","The trail leads to a quiet town where a neighbour recognises Daniel's photograph."],
["The Truth","A hidden secret is finally revealed.","The stranger tells Amina what happened years ago. At last, the pieces begin to fit."],
["The Enemy","Amina discovers who has been working against them.","The person behind the messages is closer than Amina imagined."],
["The Final Test","Daniel must prove that he can be trusted.","Daniel has one chance to show that his actions match his promises."],
["The Last Chance","Amina makes her most difficult decision.","Amina asks for honesty, not another promise. Daniel must answer."],
["A New Beginning","The truth changes their future forever.","After everything, Amina decides what kind of future she wants. Their story reaches a new beginning."]
];

const stories = [
["The Secret of the Old House","A traveller inherits an old house and discovers a diary that changes everything.","A traveller arrives at a quiet village to claim an inherited house. In a locked room, they discover a diary. Its final page contains a name nobody in the family will discuss. The mystery has only begun."],
["A Promise at Sunrise","Two friends make a promise that is tested by distance and time.","Before leaving their hometown, two friends promise to meet again at sunrise one year later. Life takes them in different directions, but neither forgets the promise."]
];
function setSiteLanguage(language) {
  const translations = {
    en: ["Home", "Stories", "AI Drama", "Videos", "Stories • AI Drama • Videos"],
    sw: ["Nyumbani", "Hadithi", "Drama za AI", "Video", "Hadithi • Drama za AI • Video"],
    fr: ["Accueil", "Histoires", "Drame IA", "Vidéos", "Histoires • Drame IA • Vidéos"],
    es: ["Inicio", "Historias", "Drama IA", "Vídeos", "Historias • Drama IA • Vídeos"],
    ar: ["الرئيسية", "القصص", "دراما الذكاء الاصطناعي", "الفيديوهات", "قصص • دراما • فيديوهات"]
  };

  const t = translations[language] || translations.en;
  const buttons = document.querySelectorAll("nav button");

  buttons.forEach((button, i) => {
    button.textContent = t[i];
  });

  document.querySelector("header p").textContent = t[4];
  document.documentElement.lang = language;
  document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

  document.getElementById("languageNotice").textContent =
    "Selected language: " + language;
}

function showPage(page){
const app=document.getElementById('app');

if(page==='home'){
app.innerHTML=`
<section class="card">
<h2>Welcome to Short Story World</h2>
<p class="muted">Discover original short stories, follow drama series, and watch videos when video files are added.</p>
<div class="grid">
<button onclick="showPage('stories')">Explore Stories</button>
<button onclick="showPage('drama')">Open AI Drama</button>
<button onclick="showPage('videos')">Open Videos</button>
</div>
</section>
<section class="card">
<h3>Featured drama</h3>
<p><b>Love and Betrayal</b> · Season 1 · 20 episodes</p>
<button onclick="openEpisode(1)">Start Episode 1</button>
</section>`;
}

else if(page==='stories'){
app.innerHTML='<h2>Stories</h2><p class="muted">Choose a story to read.</p><div class="grid">'+
stories.map((s,i)=>`<article class="card"><h3>${s[0]}</h3><p class="muted">${s[1]}</p><button onclick="openStory(${i})">Read story</button></article>`).join('')+'</div>';
}

else if(page==='drama'){
app.innerHTML='<section class="card"><h2>Love and Betrayal</h2><p class="muted">Season 1 · 20 episodes. Select an episode to open its story.</p><div>'+
episodes.map((e,i)=>`<button class="episode" onclick="openEpisode(${i+1})">Episode ${i+1}: ${e[0]}</button>`).join('')+
'</div></section>';
}

else if(page==='videos'){
app.innerHTML=`
<section class="card">
<h2>Videos</h2>
<p class="muted">Video player is ready. Add your MP4 video files to the project and update the video source to play them here.</p>
<video controls playsinline preload="metadata">
<source src="" type="video/mp4">
Your browser does not support video playback.
</video>
<p class="muted">No video has been uploaded yet, so there is nothing to play at the moment.</p>
</section>`;
}
}

function openEpisode(n){
const e=episodes[n-1];
if(!e)return;

document.getElementById('app').innerHTML=`
<section class="card">
<p class="muted">LOVE AND BETRAYAL · SEASON 1</p>
<h2>Episode ${n}: ${e[0]}</h2>
<p>${e[1]}</p>
<h3>Episode story</h3>
<p class="muted">${e[2]}</p>
<button onclick="showPage('drama')">Back to episodes</button>
<button class="secondary" onclick="openEpisode(${Math.min(n+1,20)})" ${n===20?'disabled':''}>Next episode</button>
</section>`;

window.scrollTo(0,0);
}

function openStory(i){
const s=stories[i];

document.getElementById('app').innerHTML=`
<section class="card">
<h2>${s[0]}</h2>
<p class="muted">${s[2]}</p>
<button onclick="showPage('stories')">Back to stories</button>
</section>`;

window.scrollTo(0,0);
}

showPage('home');
</script>
</body>
</html>
